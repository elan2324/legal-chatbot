<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Guidance Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}" />
  </head>

  <body>
    <section class="msger" id="chat-app">
      <header class="msger-header">
        <div class="msger-header-title">
          Legal Guidance Chatbot
          <span>Signed in as {{ username }}</span>
        </div>
        <form action="{{ url_for('logout') }}" method="post">
          <button type="submit" class="logout-btn">Logout</button>
        </form>
      </header>

      <main class="msger-chat" id="chatMessages" aria-live="polite">
        <div class="msg left-msg">
          <div class="msg-img" aria-hidden="true"></div>
          <div class="msg-bubble">
            <div class="msg-info">
              <div class="msg-info-name">Legal Bot</div>
              <div class="msg-info-time">Now</div>
            </div>
            <div class="msg-text">
              Hi. Ask a legal-information question to get started.
            </div>
          </div>
        </div>
      </main>

      <form class="msger-inputarea" id="chatForm" autocomplete="off">
        <input
          type="text"
          class="msger-input"
          id="textInput"
          maxlength="2000"
          placeholder="Enter your message..."
          aria-label="Legal question"
          required
        />
        <button type="submit" class="msger-send-btn">Send</button>
      </form>
    </section>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script>
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) window.location.reload();
      });
    </script>
  </body>
</html>
